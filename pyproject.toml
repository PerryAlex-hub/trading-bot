[project]
name = "tradingbot"
version = "0.1.0"
description = "Crypto signal-analysis bot: deterministic feature engine + LLM reasoning layer, signals only."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
