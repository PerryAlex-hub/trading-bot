# Render blueprint for the read-only API.
#
# Free-tier facts this is built around:
#   * 750 instance-hours/month per workspace, enough for ONE always-available
#     service (a 31-day month is 744 hours).
#   * A free web service spins down after 15 minutes idle and takes ~1 minute
#     to wake.
#
# The cold start is acceptable because this API is NOT on the trading path:
# GitHub Actions runs the jobs and Telegram pushes the signals. This service
# only reads the journal, so it being asleep costs nothing but a slow first
# page load.
#
# Kept awake by an external pinger (cron-job.org) hitting /ping every ~10
# minutes. /ping touches no database, which matters: a pinger pointed at an
# endpoint that queries Neon would hold its compute on permanently and exhaust
# the free 100 CU-hour allowance.
#
# 750 instance-hours/month is per WORKSPACE and a 31-day month is 744 hours, so
# an always-awake service uses essentially all of it. If it runs out, every free
# web service here is suspended until next month - but the GitHub Actions
# scheduler is independent, so signals keep arriving in Telegram.
#
# Deliberately NOT a background worker: those are paid-only on Render.

services:
  - type: web
    name: tradingbot-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      # Read-only service. Hardcoded rather than inherited so no deploy
      # setting can ever arm the API to place orders.
      # This service only reads the journal and serves the Telegram webhook.
      # Paper positions are opened by the scheduler, not here.
      - key: TRADING_MODE
        value: signal_only
      - key: CONFIG_DIR
        value: /app/config
      - key: LOG_LEVEL
        value: INFO
      # Set in the Render dashboard, not here: this file is committed.
      # Use the POOLED Neon string (the host containing '-pooler').
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Required, or the webhook rejects all traffic and the bot is read-only.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Optional here, and listed only for completeness. PUBLIC_BASE_URL is
      # read by exactly one function, register_webhook(), which runs when you
      # invoke `tradingbot telegram-setup` - and you run that from your own
      # machine, not from this service. The running web service never reads it.
      # Set it in your local .env instead; the value is the URL Render shows at
      # the top of this service's page.
      - key: PUBLIC_BASE_URL
        sync: false
