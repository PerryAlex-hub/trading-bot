# The scheduler. This file IS the bot's cron.
#
# It is also the part of the deployment that must keep working no matter what:
# the Render service can be suspended for exhausting its free hours and signals
# will still arrive, because this workflow talks to Neon and Telegram directly
# and does not depend on the API at all.
#
# Why GitHub Actions rather than a hosted worker: as of late 2026 there is no
# free always-on worker anywhere. Fly removed the free allowance for new orgs
# and Render's background workers are paid-only. But this bot does not need a
# daemon - its primary decision timeframe is 4h, so it needs six scheduled runs
# a day, which is exactly what cron is for.
#
# MINUTE BUDGET. Read this before changing any schedule.
#   * Public repo  -> unlimited Actions minutes. Nothing below matters.
#   * Private repo -> 2,000 min/month, and GitHub's default spending limit of
#     $0 makes that a HARD STOP, not an overage. Current cost:
#         analyse  6 runs/day  x ~2 min = ~360 min/month
#         monitor 24 runs/day  x ~0.4 min (exits early when flat) = ~290 min/month
#         ------------------------------------------------------- ~650 min/month
#     That leaves room for CI. A 15-minute analyse schedule would cost
#     ~5,760 min/month and die around day 10 of every month.
#
# Schedules are intentionally offset a few minutes past the bar close: the
# analysis uses the most recently CLOSED bar, and firing exactly on the
# boundary risks racing the exchange's own candle finalisation.
#
# WHY THE MONITOR LIVES IN ITS OWN FILE NOW. This workflow originally carried
# both crons, which put them in one concurrency group. Measured over the first
# 37 hours of deployment: 7 scheduled runs arrived out of roughly 46 expected,
# alternating perfectly analyse/monitor/analyse/monitor with 25-65 minute
# delays. Analysis ran 3 times instead of 9, so two thirds of 4h bars were
# never looked at. Two schedules contending for one group is the likeliest
# cause, and separating them is free. GitHub also drops scheduled triggers on
# its own under load, so see the note in monitor.yml about not trusting cron
# for timing.

name: analyse

on:
  schedule:
    # 4h bar closes (00:00/04:00/08:00/12:00/16:00/20:00 UTC).
    # A delayed or dropped trigger is now survivable: `analyse` catches up on
    # the last 6 bars that have no successful run, analysing each with only the
    # data available at that bar, before analysing the current one. Backfilled
    # bars are journalled silently - only the current bar is alerted and only
    # it opens a paper position. So the schedule below sets the cadence, not
    # the coverage, and one surviving run per 24h still fills the journal.
    # Minute 23, not 7. GitHub queues scheduled workflows and drops them under
    # load, and the first ten minutes of each hour are the most contended slot
    # on the platform - an enormous number of crons are written on the hour.
    # Measured on 2026-11-25 at minute 7: two of five expected analyse runs
    # arrived, a 40% delivery rate, and the hourly monitor at minute 37 managed
    # 14%. Moving off the busy minute is a mitigation with no downside; it is
    # NOT a fix, and the external-trigger note in monitor.yml remains the real
    # answer if delivery still disappoints.
    - cron: "23 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: analyse
        type: choice
        options: [analyse, monitor, ingest, doctor, refresh-specs]
      force:
        description: "Re-analyse a bar that was already processed"
        required: false
        default: false
        type: boolean

# Never let two runs touch the database at once. A second analyse starting
# while the first is mid-execution could double-submit; the client_order_id
# guard would catch it, but not racing in the first place is better.
concurrency:
  group: analyse-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ENVIRONMENT: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # signal_only or paper. There is no live mode: this project holds no
      # exchange credentials and contains no code that could place an order.
      # A repository VARIABLE rather than a secret, so the mode is visible.
      TRADING_MODE: ${{ vars.TRADING_MODE || 'paper' }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
      # Binance's main API returns HTTP 451 from many cloud IP ranges, and
      # GitHub's runners are Azure-hosted, so ingest fails here even though it
      # works locally. This no longer needs operator action: the client now
      # detects a 451/403 and falls back to https://data-api.binance.vision
      # (spot routes) on its own, once per process.
      #
      # That change was made because this comment used to be the fix, and it
      # was not enough. Every ingest on the first deployment returned 451;
      # symbols with stored candles were still analysed from the database so
      # the run looked healthy, while the two newly added symbols had nothing
      # stored and were skipped in silence.
      #
      # These variables remain as an override, to pin a host deliberately. An
      # unset variable arrives as an empty string, which the settings layer
      # treats as "use the default".
      BINANCE_BASE_URL: ${{ vars.BINANCE_BASE_URL }}
      BINANCE_USE_FUTURES: ${{ vars.BINANCE_USE_FUTURES || 'true' }}
      CONFIG_DIR: ${{ github.workspace }}/config
      # A literal path, not ${{ runner.temp }}. The `runner` context does not
      # exist in a job-level env block - only github, vars, secrets, needs,
      # strategy, matrix and inputs do - and referencing it there makes the
      # whole workflow file invalid, so every run fails at startup before a
      # single step executes. The job pins runs-on: ubuntu-latest, so /tmp is
      # guaranteed to exist and be writable.
      CACHE_DIR: /tmp/tradingbot-cache
      GIT_SHA: ${{ github.sha }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Fail fast if the database is not configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add the POOLED Neon connection string (the host containing '-pooler')."
            exit 1
          fi

      # Diagnoses the one failure that is environment-specific and otherwise
      # looks like a bug: Binance geo-blocks many cloud IPs with HTTP 451, so
      # ingest can fail on a runner while working perfectly on a laptop. This
      # prints the verdict instead of leaving you to infer it from a stack
      # trace. Never fails the job.
      - name: Check the market data host is reachable
        continue-on-error: true
        run: |
          HOST="${BINANCE_BASE_URL:-https://fapi.binance.com}"
          if [ "${BINANCE_USE_FUTURES}" = "false" ] && [ -z "${BINANCE_BASE_URL}" ]; then
            HOST="https://api.binance.com"
          fi
          case "$HOST" in
            *binance.vision) PATHPART="/api/v3/klines" ;;
            *fapi.binance.com) PATHPART="/fapi/v1/klines" ;;
            *) PATHPART="/api/v3/klines" ;;
          esac
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${HOST}${PATHPART}?symbol=BTCUSDT&interval=4h&limit=1" || echo "000")
          echo "GET ${HOST}${PATHPART} -> HTTP ${CODE}"
          if [ "$CODE" = "451" ]; then
            echo "::notice::Binance returns 451 (restricted location) from this runner, which is expected on GitHub's Azure IPs. The client falls back to https://data-api.binance.vision automatically; no action needed. Check the ingest log for 'falling back to the public data mirror' to confirm."
          elif [ "$CODE" != "200" ]; then
            echo "::warning::Market data host returned HTTP ${CODE}; ingest will likely fail."
          fi

      # A scheduled run is always the analysis. Manual runs can pick any job,
      # which is what makes `doctor` and `refresh-specs` reachable without a
      # local checkout.
      - name: Select job
        id: select
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            echo "job=analyse" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure schema exists
        if: steps.select.outputs.job == 'analyse'
        run: tradingbot init-db

      - name: Run
        run: |
          case "${{ steps.select.outputs.job }}" in
            analyse)
              tradingbot analyse ${{ inputs.force == true && '--force' || '' }}
              ;;
            monitor)       tradingbot monitor ;;
            ingest)        tradingbot ingest ;;
            doctor)        tradingbot doctor ;;
            refresh-specs) tradingbot refresh-specs ;;
          esac

      # A failed scheduled run is otherwise completely silent: nobody watches
      # the Actions tab, and a bot that has quietly stopped analysing looks
      # exactly like a market with no setups.
      - name: Notify on failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=BOT FAILURE: ${{ steps.select.outputs.job }} job failed. See GitHub Actions run ${{ github.run_id }}." \
            > /dev/null || true
