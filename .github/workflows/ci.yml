# Tests and linting. Runs against in-memory SQLite, so CI needs no database
# and no secrets - which is what keeps it inside the free minute budget and
# means a fork can run it.

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # No DATABASE_URL on purpose: anything that silently requires a live
      # database is a thing that will fail on deploy, and CI should catch that.
      ENVIRONMENT: ci
      TRADING_MODE: signal_only
      CONFIG_DIR: ${{ github.workspace }}/config

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q --cov=tradingbot --cov-report=term-missing

      # The strongest invariant this project has: there is no code path that
      # could place an order. Asserted in CI so a future refactor that
      # reintroduces an execution venue or exchange credentials fails loudly
      # rather than passing unnoticed.
      - name: Assert there is no execution capability
        run: |
          python - <<'PY'
          import tradingbot.exchanges as exchanges
          import tradingbot.execution as execution
          from tradingbot.settings import Settings, TradingMode

          assert not hasattr(execution, "ExecutionEngine"), "an execution engine reappeared"
          assert not hasattr(exchanges, "WeexTradingClient"), "an authenticated client reappeared"
          assert {m.value for m in TradingMode} == {"signal_only", "paper"}, "a new trading mode appeared"
          for mode in TradingMode:
              assert not Settings(trading_mode=mode).can_place_real_orders
          credentials = {"weex_api_key", "weex_api_secret", "weex_api_passphrase", "live_trading_enabled"}
          leaked = credentials & set(Settings.model_fields)
          assert not leaked, f"exchange credentials reappeared in settings: {leaked}"
          print("OK: no execution capability, no exchange credentials")
          PY
