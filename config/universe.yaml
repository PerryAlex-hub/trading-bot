# Trading universe.
#
# Tiers:
#   core    - deep liquidity, long history. Tradeable. Also used to read market regime.
#   satellite - user-selected higher-beta names. Tradeable with reduced size.
#   paper   - signals generated and journaled, but NEVER sized for live execution.
#             Auto-promotable to satellite once min_history_days is satisfied.
#   context - never traded. Fed to the analysis layer as market context only.
#
# Nothing here hardcodes exchange minimums. Those are loaded at runtime from
# the WEEX contract-info endpoint (see src/tradingbot/exchanges/weex.py).

quote: USDT

symbols:
  - symbol: BTCUSDT
    tier: core
    notes: "Regime anchor. Deepest book in crypto; drives beta for everything else."

  - symbol: SOLUSDT
    tier: core
    notes: "High beta with real liquidity and clean trending behaviour."

  # Added for small-account testing. WEEX futures are contract-denominated, so
  # the smallest order is one contract and costs `contract_val x price`. BTC's
  # minimum is ~6 USDT purely because BTC is expensive; a coin priced in
  # millionths of a dollar costs a fraction of a cent to open. PEPE is the only
  # name that is simultaneously that cheap AND genuinely liquid: 47M USD of
  # 24h volume over 114,230 trades, measured 2026-11-24.
  - symbol: PEPEUSDT
    tier: satellite
    notes: "Cheapest liquid unit price, so the venue minimum is a fraction of a cent."

  # The most liquid name in the sub-dollar tier by a wide margin: 158M USD and
  # 683,383 trades, more active than SOL. Also the closest thing crypto has to
  # a decorrelated major, since it moves on its own regulatory calendar.
  - symbol: XRPUSDT
    tier: satellite
    notes: "Deepest sub-dollar book; moves on its own catalysts rather than BTC beta."

  # 39M USD of 24h volume over 419,112 trades, measured 2026-11-24 - the most
  # actively traded name in the cheap tier. Pure sentiment beta, which is what
  # earns it a place alongside the two majors.
  - symbol: DOGEUSDT
    tier: satellite
    notes: "High beta, deep book, years of history."

# Context-only feeds. Never traded, never sized.
context:
  - symbol: ETHUSDT
    notes: "ETH/BTC ratio input; alt-risk appetite."
  # Literal BTC dominance is NOT used, and this entry stays only to record the
  # decision. Real dominance is BTC market cap over total market cap, which
  # needs circulating supplies from a market-data provider - and such an API
  # serves the CURRENT value with no history stored here. Every backfilled bar
  # and every future backtest would then be judged against today's dominance,
  # which is exactly the lookahead bias the `as_of` plumbing elsewhere exists
  # to prevent. A number that cannot be computed for a past bar cannot be part
  # of a strategy this project is able to evaluate.
  #
  # What is implemented instead, from candles already stored, is ALT BREADTH:
  # the fraction of the universe's alts outperforming BTC over 30 bars. It
  # answers the same question - is risk appetite travelling out along the
  # curve, or hiding in BTC - and below 25% it blocks satellite longs outright
  # via MarketRegime.allows_satellite_longs. See analysis/regime.py.
  - symbol: BTC.D
    source: not_implemented
    notes: "Superseded by alt breadth, which is backtestable. See analysis/regime.py."

# Timeframes pulled for every symbol. The primary decision timeframe is listed first.
timeframes:
  primary: 4h
  additional:
    - 1d
    - 1h
    - 15m
